<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardSync Pro — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-color: #f3eeff;
    --card-bg: #ffffff;
    --primary: #7c4dff;
    --primary-light: #ede7ff;
    --primary-dark: #5e35b1;
    --text-dark: #2a2438;
    --text-muted: #756a8a;
    --border-color: #e2d9f3;
    --row-hover: #f9f6ff;
    --success: #2e7d32;
    --success-bg: #e8f5e9;
    --danger: #d32f2f;
    --danger-bg: #ffebee;
    --warn: #b8860b;
    --warn-bg: #fff6e0;
    --shadow-soft: 0 4px 20px rgba(124, 77, 255, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg-color); color: var(--text-dark);
    font-family: 'Space Grotesk', -apple-system, sans-serif;
  }
  code, .mono { font-family: 'JetBrains Mono', monospace; }

  /* ── LOGIN ────────────────────────────────────────────────── */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  #login-card { background: var(--card-bg); border-radius: 18px; box-shadow: var(--shadow-soft); padding: 32px 30px; width: min(340px, 90vw); }
  #login-card h1 { font-size: 19px; margin: 0 0 4px; }
  #login-card p.sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 22px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 12px 0 5px; }
  input[type="text"], input[type="password"], input[type="number"] {
    width: 100%; padding: 10px 12px; border-radius: 9px;
    border: 1.5px solid var(--border-color); font-size: 14px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--primary); }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 10px; }
  #login-submit { width: 100%; margin-top: 20px; padding: 11px; background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; }
  #login-submit:disabled { opacity: .6; cursor: default; }
  #login-error { display: none; margin-top: 12px; padding: 9px 11px; background: var(--danger-bg); color: var(--danger); border-radius: 8px; font-size: 12.5px; line-height: 1.4; }

  /* ── ACCESSO NEGATO ───────────────────────────────────────── */
  #denied-screen { display: none; min-height: 100vh; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 20px; }
  #denied-screen h1 { font-size: 20px; margin: 0; }
  #denied-screen p { color: var(--text-muted); max-width: 360px; margin: 0; }

  /* ── DASHBOARD ────────────────────────────────────────────── */
  #dash { display: none; max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }
  header.dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  header.dash-header h1 { font-size: 20px; margin: 0; }
  header.dash-header .who { font-size: 12px; color: var(--text-muted); }
  #logout-btn { background: var(--primary-light); color: var(--primary-dark); padding: 8px 14px; font-size: 12.5px; font-weight: 600; border-radius: 8px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab-btn { background: var(--card-bg); border: 1.5px solid var(--border-color); padding: 9px 16px; font-size: 13px; font-weight: 600; color: var(--text-muted); border-radius: 10px; display: flex; align-items: center; gap: 6px; }
  .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .tab-count { background: rgba(255,255,255,.35); color: inherit; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 20px; }
  .tab-btn:not(.active) .tab-count { background: var(--warn-bg); color: var(--warn); }

  .panel { display: none; }
  .panel.active { display: block; }

  .card { background: var(--card-bg); border-radius: 14px; box-shadow: var(--shadow-soft); padding: 4px 0; margin-bottom: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--border-color); }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--row-hover); }
  .row .main { flex: 1; min-width: 0; }
  .row .main.clickable { cursor: pointer; }
  .row .main .name { font-weight: 600; font-size: 14px; }
  .row .main .meta { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; }
  .badge.admin { background: var(--primary-light); color: var(--primary-dark); }
  .badge.user { background: var(--border-color); color: var(--text-muted); }
  .badge.pending { background: var(--warn-bg); color: var(--warn); }
  .badge.approved { background: var(--success-bg); color: var(--success); }
  .badge.rejected { background: var(--danger-bg); color: var(--danger); }
  .badge.banned { background: var(--danger-bg); color: var(--danger); }
  .badge.deleted { background: #eee; color: #888; }
  .badge.active { background: var(--success-bg); color: var(--success); }

  .btn-small { padding: 7px 12px; font-size: 12px; font-weight: 600; border-radius: 8px; white-space: nowrap; }
  .btn-toggle-role { background: var(--primary-light); color: var(--primary-dark); }
  .btn-approve { background: var(--success-bg); color: var(--success); }
  .btn-reject { background: var(--danger-bg); color: var(--danger); }
  .btn-ghost { background: var(--border-color); color: var(--text-dark); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-small:disabled { opacity: .5; cursor: default; }

  .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-bar input { flex: 1; }
  .search-bar select { padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--border-color); font-family: inherit; font-size: 13px; }

  .empty-state { padding: 30px 18px; text-align: center; color: var(--text-muted); font-size: 13px; }
  .status-msg { font-size: 12.5px; padding: 9px 14px; border-radius: 9px; margin-bottom: 14px; display: none; }
  .status-msg.ok { display: block; background: var(--success-bg); color: var(--success); }
  .status-msg.err { display: block; background: var(--danger-bg); color: var(--danger); }

  /* ── MODALE DETTAGLIO UTENTE ─────────────────────────────── */
  #user-modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(42,36,56,.45); z-index: 50; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; }
  #user-modal { background: var(--card-bg); border-radius: 16px; width: min(520px, 100%); box-shadow: var(--shadow-soft); }
  #user-modal .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border-color); }
  #user-modal .modal-head h2 { font-size: 16px; margin: 0; }
  #user-modal .modal-close { background: var(--border-color); width: 30px; height: 30px; border-radius: 50%; font-size: 14px; padding: 0; }
  #user-modal .modal-body { padding: 18px 20px; }
  #user-modal .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted); margin: 16px 0 8px; }
  #user-modal .section-title:first-child { margin-top: 0; }
  .action-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .inline-form { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .inline-form input[type="number"] { width: 80px; }
  .log-line { font-size: 12px; padding: 7px 0; border-bottom: 1px dashed var(--border-color); }
  .log-line:last-child { border-bottom: none; }
  .log-line .lmeta { color: var(--text-muted); font-size: 11px; }
  .danger-box { background: var(--danger-bg); border-radius: 10px; padding: 12px 14px; margin-top: 8px; }
  .danger-box p { font-size: 12px; color: var(--danger); margin: 0 0 8px; font-weight: 600; }
  .pw-reveal { background: var(--primary-light); border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 13px; }
  .pw-reveal .pw-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; margin: 6px 0; letter-spacing: .5px; }
</style>
</head>
<body>

<!-- ── SCHERMATA LOGIN ─────────────────────────────────────────── -->
<div id="login-screen">
  <div id="login-card">
    <h1>🔐 CardSync Pro — Admin</h1>
    <p class="sub">Accedi con il tuo account CardSync Pro.</p>
    <label for="login-user">Nome utente</label>
    <input type="text" id="login-user" autocomplete="username" placeholder="es. claudio">
    <label for="login-pass">Password</label>
    <input type="password" id="login-pass" autocomplete="current-password">
    <div id="login-error"></div>
    <button id="login-submit">Accedi</button>
  </div>
</div>

<!-- ── ACCESSO NEGATO ──────────────────────────────────────────── -->
<div id="denied-screen">
  <h1>⛔ Accesso riservato</h1>
  <p>Il tuo account non ha i permessi di amministratore, oppure è sospeso/disattivato. Se pensi sia un errore, contatta chi gestisce CardSync Pro.</p>
  <button id="denied-logout" style="background:var(--primary-light);color:var(--primary-dark);padding:9px 16px;font-size:13px;font-weight:600;">Esci</button>
</div>

<!-- ── DASHBOARD ───────────────────────────────────────────────── -->
<div id="dash">
  <header class="dash-header">
    <div>
      <h1>Dashboard admin</h1>
      <div class="who" id="who-label"></div>
    </div>
    <button id="logout-btn">🚪 Esci</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="richieste">📋 Richieste <span class="tab-count" id="count-richieste">0</span></button>
    <button class="tab-btn" data-tab="utenti">👥 Utenti</button>
    <button class="tab-btn" data-tab="logadmin">🛡️ Log admin</button>
  </div>

  <div id="status-msg" class="status-msg"></div>

  <!-- RICHIESTE -->
  <div class="panel active" id="panel-richieste">
    <div class="card" id="richieste-list"><div class="empty-state">Caricamento…</div></div>
  </div>

  <!-- UTENTI -->
  <div class="panel" id="panel-utenti">
    <div class="search-bar">
      <input type="text" id="utenti-search" placeholder="Cerca per nome utente…">
      <select id="utenti-filter">
        <option value="all">Tutti</option>
        <option value="active">Attivi</option>
        <option value="banned">Bannati</option>
        <option value="deleted">Eliminati</option>
        <option value="admin">Solo admin</option>
      </select>
    </div>
    <div class="card" id="utenti-list"><div class="empty-state">Caricamento…</div></div>
  </div>

  <!-- LOG ADMIN -->
  <div class="panel" id="panel-logadmin">
    <div class="card" id="logadmin-list"><div class="empty-state">Caricamento…</div></div>
  </div>
</div>

<!-- ── MODALE DETTAGLIO UTENTE ───────────────────────────────────── -->
<div id="user-modal-backdrop">
  <div id="user-modal">
    <div class="modal-head">
      <h2 id="modal-username">—</h2>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- riempito via JS -->
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://iwdkgehbktvkujhwqdwq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3ZGtnZWhia3R2a3VqaHdxZHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMzM1MzYsImV4cCI6MjEwMTcwOTUzNn0.Pdcmuj5eXuh_z43CInsdGRkNwloHpqlhBGnBI9kvKe0';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const POKEMON_NAMES = ['pikachu','eevee','mewtwo','mew','snorlax','gengar','abra','kadabra','machop','geodude','onix','lapras','ditto','meowth','psyduck','vulpix','squirtle','weedle','pidgey','rattata','spearow','ekans','nidoran','zubat','oddish','paras','venonat','diglett','doduo','seel','grimer','shellder','gastly','drowzee','krabby','voltorb','cubone','koffing','rhyhorn','chansey','tangela','horsea','goldeen','staryu','scyther','magmar','pinsir','tauros','magikarp','zapdos','moltres','dratini','pichu','togepi','natu','mareep','hoppip','sunkern','yanma','wooper','murkrow','unown','pineco','gligar','snubbull','qwilfish','shuckle','sneasel','slugma','swinub','corsola','remoraid','delibird','phanpy','stantler','smeargle','tyrogue','elekid','magby','larvitar','pupitar','lugia','celebi'];
function generaPassword() {
  return POKEMON_NAMES[Math.floor(Math.random() * POKEMON_NAMES.length)];
}

const loginScreen  = document.getElementById('login-screen');
const deniedScreen = document.getElementById('denied-screen');
const dash         = document.getElementById('dash');

function mostraSolo(el) {
  [loginScreen, deniedScreen, dash].forEach(e => e.style.display = 'none');
  el.style.display = (el === dash) ? 'block' : 'flex';
}

// ── LOGIN ──────────────────────────────────────────────────────
const elUser  = document.getElementById('login-user');
const elPass  = document.getElementById('login-pass');
const elErr   = document.getElementById('login-error');
const elSubmit = document.getElementById('login-submit');

async function tentaLogin() {
  const inputUtente = elUser.value.trim();
  const password = elPass.value;
  if (!inputUtente || !password) {
    elErr.textContent = 'Inserisci nome utente e password.';
    elErr.style.display = 'block';
    return;
  }
  const email = inputUtente.includes('@') ? inputUtente : inputUtente.toLowerCase() + '@cardsyncpro.local';
  elSubmit.disabled = true;
  elSubmit.textContent = 'Accesso in corso…';
  elErr.style.display = 'none';

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    elErr.textContent = '❌ ' + (error.message === 'Invalid login credentials' ? 'Nome utente o password errati.' : error.message);
    elErr.style.display = 'block';
    elSubmit.disabled = false;
    elSubmit.textContent = 'Accedi';
    return;
  }
  await controllaRuoloEAvvia();
}

elSubmit.addEventListener('click', tentaLogin);
[elUser, elPass].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') tentaLogin(); }));

async function logout() {
  await supabaseClient.auth.signOut();
  location.reload();
}
document.getElementById('logout-btn').addEventListener('click', logout);
document.getElementById('denied-logout').addEventListener('click', logout);

// ── CONTROLLO RUOLO ADMIN ─────────────────────────────────────
async function controllaRuoloEAvvia() {
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (!sessionData.session) { mostraSolo(loginScreen); return; }

  const { data: profilo, error } = await supabaseClient
    .from('profiles')
    .select('role, username')
    .eq('id', sessionData.session.user.id)
    .single();

  if (error || !profilo || profilo.role !== 'admin') {
    mostraSolo(deniedScreen);
    return;
  }

  document.getElementById('who-label').textContent =
    (profilo.username || sessionData.session.user.email) + ' — admin';
  mostraSolo(dash);
  caricaRichieste();
  caricaUtenti();
  caricaLogAdmin();
}

// ── TABS ───────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

function mostraStatus(msg, ok) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + (ok ? 'ok' : 'err');
  clearTimeout(mostraStatus._t);
  mostraStatus._t = setTimeout(() => { el.className = 'status-msg'; }, 4500);
}

function fmtData(d) { return d ? new Date(d).toLocaleString('it-IT') : '—'; }

// ── RICHIESTE PENDENTI ─────────────────────────────────────────
async function caricaRichieste() {
  const cont = document.getElementById('richieste-list');
  const { data, error } = await supabaseClient
    .from('pending_requests')
    .select('*, profiles:user_id (username)')
    .is('deleted_at', null)
    .order('created_at', { ascending: false });

  if (error) { cont.innerHTML = `<div class="empty-state">Errore: ${error.message}</div>`; return; }

  const nPending = (data || []).filter(r => r.status === 'pending').length;
  document.getElementById('count-richieste').textContent = nPending;

  if (!data || data.length === 0) { cont.innerHTML = '<div class="empty-state">Nessuna richiesta al momento.</div>'; return; }

  cont.innerHTML = data.map(r => `
    <div class="row" data-id="${r.id}">
      <div class="main">
        <div class="name">${r.type} <span class="badge ${r.status}">${r.status}</span></div>
        <div class="meta mono">${(r.profiles && r.profiles.username) || r.user_id} · ${fmtData(r.created_at)}</div>
      </div>
      ${r.status === 'pending' ? `
        <button class="btn-small btn-approve" data-action="approve">✔ Approva</button>
        <button class="btn-small btn-reject" data-action="reject">✘ Rifiuta</button>
      ` : ''}
    </div>
  `).join('');

  cont.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const riga = btn.closest('.row');
      const id = riga.dataset.id;
      const nuovoStato = btn.dataset.action === 'approve' ? 'approved' : 'rejected';
      riga.querySelectorAll('button').forEach(b => b.disabled = true);

      const { data: sessionData } = await supabaseClient.auth.getSession();
      const { error } = await supabaseClient
        .from('pending_requests')
        .update({ status: nuovoStato, reviewed_at: new Date().toISOString(), reviewed_by: sessionData.session.user.id })
        .eq('id', id);

      if (error) { mostraStatus('Errore: ' + error.message, false); riga.querySelectorAll('button').forEach(b => b.disabled = false); return; }
      await supabaseClient.rpc('log_admin_action', {
        p_action: nuovoStato === 'approved' ? 'request_approved' : 'request_rejected',
        p_target: null, p_details: { request_id: id }
      });
      mostraStatus('Richiesta aggiornata.', true);
      caricaRichieste();
    });
  });
}

// ── UTENTI / RUOLI ────────────────────────────────────────────
let ultimaListaUtenti = [];

async function caricaUtenti() {
  const cont = document.getElementById('utenti-list');
  const { data, error } = await supabaseClient
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: true });

  if (error) { cont.innerHTML = `<div class="empty-state">Errore: ${error.message}</div>`; return; }
  ultimaListaUtenti = data || [];
  renderUtenti();
}

function statoUtente(u) {
  if (u.deleted_at) return { key: 'deleted', label: 'eliminato' };
  if (u.banned_until && new Date(u.banned_until) > new Date()) {
    const perma = u.banned_until.startsWith('9999') || u.banned_until === 'infinity';
    return { key: 'banned', label: perma ? 'perma-ban' : ('bannato fino al ' + fmtData(u.banned_until)) };
  }
  return { key: 'active', label: 'attivo' };
}

function renderUtenti() {
  const cont = document.getElementById('utenti-list');
  const q = document.getElementById('utenti-search').value.trim().toLowerCase();
  const filtro = document.getElementById('utenti-filter').value;

  let lista = ultimaListaUtenti.filter(u => {
    if (q && !(u.username || '').toLowerCase().includes(q)) return false;
    const s = statoUtente(u);
    if (filtro === 'active' && s.key !== 'active') return false;
    if (filtro === 'banned' && s.key !== 'banned') return false;
    if (filtro === 'deleted' && s.key !== 'deleted') return false;
    if (filtro === 'admin' && u.role !== 'admin') return false;
    return true;
  });

  if (lista.length === 0) { cont.innerHTML = '<div class="empty-state">Nessun utente trovato.</div>'; return; }

  cont.innerHTML = lista.map(u => {
    const s = statoUtente(u);
    return `
    <div class="row" data-id="${u.id}">
      <div class="main clickable" data-open="${u.id}">
        <div class="name">${u.username || '(senza nome)'} <span class="badge ${u.role}">${u.role}</span> <span class="badge ${s.key}">${s.label}</span></div>
        <div class="meta mono">${u.id}</div>
      </div>
      <button class="btn-small btn-toggle-role" data-role="${u.role}" data-id="${u.id}">
        ${u.role === 'admin' ? 'Rendi utente' : 'Rendi admin'}
      </button>
    </div>`;
  }).join('');

  cont.querySelectorAll('[data-open]').forEach(el => {
    el.addEventListener('click', () => apriModaleUtente(el.dataset.open));
  });

  cont.querySelectorAll('.btn-toggle-role').forEach(btn => {
    btn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.id;
      const ruoloAttuale = btn.dataset.role;
      const nuovoRuolo = ruoloAttuale === 'admin' ? 'user' : 'admin';
      const utente = ultimaListaUtenti.find(u => u.id === id);
      if (!confirm(`Confermi: cambiare il ruolo di "${utente.username}" in "${nuovoRuolo}"?`)) return;
      btn.disabled = true;

      const { error } = await supabaseClient.from('profiles').update({ role: nuovoRuolo }).eq('id', id);
      if (error) { mostraStatus('Errore: ' + error.message, false); btn.disabled = false; return; }
      await supabaseClient.rpc('log_admin_action', { p_action: 'role_change', p_target: id, p_details: { nuovo_ruolo: nuovoRuolo } });
      mostraStatus('Ruolo aggiornato.', true);
      caricaUtenti();
    });
  });
}

document.getElementById('utenti-search').addEventListener('input', renderUtenti);
document.getElementById('utenti-filter').addEventListener('change', renderUtenti);

// ── LOG ADMIN (tab dedicato) ─────────────────────────────────
async function caricaLogAdmin() {
  const cont = document.getElementById('logadmin-list');
  const { data, error } = await supabaseClient
    .from('admin_audit_log')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(200);

  if (error) { cont.innerHTML = `<div class="empty-state">Errore: ${error.message}</div>`; return; }
  if (!data || data.length === 0) { cont.innerHTML = '<div class="empty-state">Nessuna azione registrata.</div>'; return; }

  cont.innerHTML = data.map(r => `
    <div class="row">
      <div class="main">
        <div class="name">${r.action}</div>
        <div class="meta mono">${fmtData(r.created_at)} · admin ${r.admin_id}${r.target_user_id ? ' · target ' + r.target_user_id : ''}</div>
      </div>
    </div>
  `).join('');
}

// ── MODALE DETTAGLIO UTENTE ───────────────────────────────────
const modalBackdrop = document.getElementById('user-modal-backdrop');
const modalBody = document.getElementById('modal-body');
document.getElementById('modal-close').addEventListener('click', () => modalBackdrop.style.display = 'none');
modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) modalBackdrop.style.display = 'none'; });

async function apriModaleUtente(userId) {
  const u = ultimaListaUtenti.find(x => x.id === userId);
  if (!u) return;
  document.getElementById('modal-username').textContent = u.username || '(senza nome)';
  renderModaleBody(u);
  modalBackdrop.style.display = 'flex';

  const { data: log } = await supabaseClient
    .from('activity_log')
    .select('*')
    .eq('user_id', userId)
    .order('created_at', { ascending: false })
    .limit(30);
  const logCont = document.getElementById('modal-activity-log');
  if (logCont) {
    if (!log || log.length === 0) {
      logCont.innerHTML = '<div class="empty-state">Nessuna attività registrata (funzione di raccolta log non ancora collegata a sito/estensione).</div>';
    } else {
      logCont.innerHTML = log.map(l => `<div class="log-line">${l.action} <span class="lmeta">— ${l.source} · ${fmtData(l.created_at)}</span></div>`).join('');
    }
  }
}

function renderModaleBody(u) {
  const s = statoUtente(u);
  modalBody.innerHTML = `
    <div class="section-title">Stato</div>
    <span class="badge ${s.key}">${s.label}</span> <span class="badge ${u.role}">${u.role}</span>

    <div class="section-title">Ban</div>
    <div class="action-grid">
      <div class="inline-form">
        <input type="number" id="ban-giorni" min="1" placeholder="gg" value="7">
        <button class="btn-small btn-ghost" data-act="ban-temp">Ban temporaneo</button>
      </div>
      <button class="btn-small btn-danger" data-act="ban-perma">Perma-ban</button>
      <button class="btn-small btn-approve" data-act="unban" ${s.key !== 'banned' ? 'disabled' : ''}>Sban</button>
    </div>

    <div class="section-title">Password</div>
    <div id="pw-area">
      <button class="btn-small btn-toggle-role" data-act="reset-pw">Genera e reimposta password</button>
    </div>

    <div class="section-title">Account</div>
    <div class="action-grid">
      ${s.key === 'deleted'
        ? `<button class="btn-small btn-approve" data-act="restore">Ripristina account</button>`
        : `<button class="btn-small btn-danger" data-act="soft-delete">Elimina account (soft)</button>`}
      <button class="btn-small btn-ghost" data-act="revoke">Revoca sessioni ora</button>
    </div>

    <div class="section-title">Zona pericolosa</div>
    <div class="danger-box">
      <p>⚠️ Hard delete: cancella DEFINITIVAMENTE l'account e tutti i dati collegati. Azione irreversibile — usala solo per ripulire account di test.</p>
      <button class="btn-small btn-danger" data-act="hard-delete">🗑 Hard delete</button>
    </div>

    <div class="section-title">Log attività (sito + estensione)</div>
    <div id="modal-activity-log"><div class="empty-state">Caricamento…</div></div>
  `;

  modalBody.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => gestisciAzioneUtente(u, btn.dataset.act));
  });
}

async function gestisciAzioneUtente(u, azione) {
  try {
    if (azione === 'ban-temp') {
      const giorni = parseInt(document.getElementById('ban-giorni').value, 10);
      if (!giorni || giorni < 1) { mostraStatus('Inserisci un numero di giorni valido.', false); return; }
      if (!confirm(`Bannare "${u.username}" per ${giorni} giorni?`)) return;
      const until = new Date(Date.now() + giorni * 86400000).toISOString();
      const { error } = await supabaseClient.rpc('admin_ban_user', { p_target: u.id, p_until: until, p_reason: `Ban temporaneo (${giorni} giorni)` });
      if (error) throw error;
      mostraStatus('Utente bannato.', true);
    }
    else if (azione === 'ban-perma') {
      if (!confirm(`Perma-bannare "${u.username}"? Resterà bloccato finché non lo sbanni tu.`)) return;
      const { error } = await supabaseClient.rpc('admin_ban_user', { p_target: u.id, p_until: '9999-12-31T23:59:59Z', p_reason: 'Perma-ban' });
      if (error) throw error;
      mostraStatus('Utente perma-bannato.', true);
    }
    else if (azione === 'unban') {
      const { error } = await supabaseClient.rpc('admin_unban_user', { p_target: u.id });
      if (error) throw error;
      mostraStatus('Ban rimosso.', true);
    }
    else if (azione === 'revoke') {
      if (!confirm(`Revocare subito tutte le sessioni attive di "${u.username}"?`)) return;
      const { error } = await supabaseClient.rpc('admin_revoke_sessions', { p_target: u.id });
      if (error) throw error;
      mostraStatus('Sessioni revocate.', true);
    }
    else if (azione === 'soft-delete') {
      if (!confirm(`Eliminare (soft) l'account "${u.username}"? È reversibile con "Ripristina".`)) return;
      const { error } = await supabaseClient.rpc('admin_soft_delete_user', { p_target: u.id });
      if (error) throw error;
      mostraStatus('Account eliminato (soft).', true);
    }
    else if (azione === 'restore') {
      const { error } = await supabaseClient.rpc('admin_restore_user', { p_target: u.id });
      if (error) throw error;
      mostraStatus('Account ripristinato.', true);
    }
    else if (azione === 'reset-pw') {
      const nuovaPw = generaPassword();
      const { error } = await supabaseClient.rpc('admin_reset_password', { p_target: u.id, p_new_password: nuovaPw });
      if (error) throw error;
      mostraStatus('Password reimpostata.', true);
      const pwArea = document.getElementById('pw-area');
      pwArea.innerHTML = `
        <div class="pw-reveal">
          Nuova password per <b>${u.username}</b>:
          <div class="pw-value">${nuovaPw}</div>
          <button class="btn-small btn-toggle-role" id="pw-share">📤 Condividi</button>
        </div>`;
      document.getElementById('pw-share').addEventListener('click', async () => {
        const testo = `CardSync Pro — la tua nuova password è: ${nuovaPw}`;
        if (navigator.share) { try { await navigator.share({ text: testo }); } catch(e) {} }
        else { await navigator.clipboard.writeText(testo); mostraStatus('Copiato negli appunti (condivisione nativa non disponibile su questo browser).', true); }
      });
    }
    else if (azione === 'hard-delete') {
      const conferma = prompt(`⚠️ AZIONE IRREVERSIBILE.\nQuesto cancella DEFINITIVAMENTE l'account "${u.username}" e tutti i suoi dati.\nScrivi esattamente "${u.username}" per confermare:`);
      if (conferma !== u.username) { mostraStatus('Conferma non corrispondente, azione annullata.', false); return; }
      const { error } = await supabaseClient.rpc('admin_hard_delete_user', { p_target: u.id });
      if (error) throw error;
      mostraStatus('Account cancellato definitivamente.', true);
      modalBackdrop.style.display = 'none';
    }

    caricaUtenti();
    caricaLogAdmin();
  } catch (err) {
    mostraStatus('Errore: ' + (err.message || err), false);
  }
}

// ── AVVIO ─────────────────────────────────────────────────────
controllaRuoloEAvvia();
</script>
