<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CardSync Pro — Sealed</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #f3eeff;
            --card-bg: #ffffff;
            --primary: #7c4dff;
            --primary-light: #ede7ff;
            --primary-dark: #5e35b1;
            --text-dark: #2a2438;
            --text-muted: #756a8a;
            --border-color: #e2d9f3;
            --success: #2e7d32;
            --success-bg: #e8f5e9;
            --shadow-soft: 0 4px 20px rgba(124, 77, 255, 0.08);
        }

        /* TEMA VERDE PASTELLO */
        body.theme-verde {
            --bg-color: #eef7f2;
            --primary: #2e7d32;
            --primary-light: #e0f2e1;
            --primary-dark: #1b5e20;
            --text-dark: #1b2e22;
            --text-muted: #647d6a;
            --border-color: #cee2d4;
            --shadow-soft: 0 4px 20px rgba(46, 125, 50, 0.08);
        }

        /* TEMA POKEMON */
        body.theme-pokemon {
            --bg-color: #edf4fc;
            --primary: #2a75d3;
            --primary-light: #dbeafe;
            --primary-dark: #18529d;
            --text-dark: #1a2738;
            --text-muted: #5e728c;
            --border-color: #cbdcf2;
            --shadow-soft: 0 4px 20px rgba(42, 117, 211, 0.08);
        }

        /* DARK MODE */
        body.dark-mode {
            --bg-color: #121018;
            --card-bg: #1c1826;
            --text-dark: #f1edfa;
            --text-muted: #9f95b5;
            --border-color: #2f2840;
            --primary-light: rgba(124, 77, 255, 0.2);
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode.theme-verde {
            --bg-color: #0d1712;
            --card-bg: #14241b;
            --text-dark: #e8f5ed;
            --text-muted: #83a38c;
            --border-color: #1f382a;
            --primary-light: rgba(46, 125, 50, 0.2);
        }

        body.dark-mode.theme-pokemon {
            --bg-color: #0f1621;
            --card-bg: #172130;
            --text-dark: #eaf2fd;
            --text-muted: #829ab8;
            --border-color: #23344a;
            --primary-light: rgba(42, 117, 211, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            min-height: 100dvh; /* iOS Safari: la barra indirizzi dinamica
                                    cambia 100vh in continuazione — dvh si
                                    adatta subito, senza "salti" di layout */
            /* spazio per la barra totale fissa in basso, + l'home indicator
               di iPhone (barra bianca in fondo, senza tasto Home fisico) */
            padding-bottom: calc(90px + env(safe-area-inset-bottom));
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.2rem;
            box-shadow: var(--shadow-soft);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: 'Press Start 2P', monospace;
            font-weight: 400;
            font-size: 0.85rem;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        @media (max-width: 420px) {
            .logo { font-size: 0.7rem; }
        }

        .logo img { width: 24px; height: 24px; object-fit: contain; }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            font-weight: 600;
        }

        .container {
            max-width: 720px;
            margin: 1.2rem auto;
            padding: 0 1rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-soft);
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            padding-left: 0.6rem;
            width: 100%;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .card-row {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0.9rem 1rem;
            margin-bottom: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            box-shadow: var(--shadow-soft);
            transition: border-color 0.15s, background-color 0.15s;
        }

        .card-row.selected {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }

        .card-checkbox {
            width: 22px;
            height: 22px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .card-thumb {
            width: 32px; height: 44px; object-fit: cover; border-radius: 4px;
            flex-shrink: 0; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        .card-info { flex: 1; min-width: 0; }

        .card-name {
            font-weight: 700;
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            margin-top: 0.3rem;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 7px;
            font-size: 0.68rem;
            font-weight: 700;
            background-color: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .card-price {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--text-dark);
            white-space: nowrap;
            text-align: right;
            min-width: 62px;
        }

        .card-price small {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-shrink: 0;
        }

        .qty-btn {
            background-color: var(--primary-light);
            color: var(--primary);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
        }

        .qty-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .qty-value {
            width: 24px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .stato-vuoto, .stato-caricamento, .stato-errore {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stato-errore { color: #d32f2f; }

        .barra-totale {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            padding: 0.9rem 1.2rem;
            /* iPhone senza tasto Home: aggiunge lo spazio dell'home indicator
               SOPRA al padding normale, così il bottone non ci finisce sotto */
            padding-bottom: calc(0.9rem + env(safe-area-inset-bottom));
            padding-left: calc(1.2rem + env(safe-area-inset-left));
            padding-right: calc(1.2rem + env(safe-area-inset-right));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            z-index: 60;
        }

        .barra-totale-info { line-height: 1.3; }
        .barra-totale-count { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; }
        .barra-totale-value { font-size: 1.25rem; font-weight: 800; color: var(--primary); }

        .btn-copia {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.7rem 1.1rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .btn-copia:disabled { opacity: 0.5; cursor: not-allowed; }

        /* A16: pulsante "Filtri" espandibile — il pannello resta chiuso di
           default per non occupare spazio fisso, coerente con la scelta di
           Claudio di tenerlo dietro un tocco invece che sempre visibile. */
        .btn-filtri {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-soft);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            width: 100%;
        }
        .btn-filtri i.fa-chevron-down { margin-left: auto; transition: transform 0.2s; color: var(--text-muted); }
        .btn-filtri.aperto i.fa-chevron-down { transform: rotate(180deg); }
        #filtriAttiviCount {
            background-color: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 0.68rem;
            padding: 0.1rem 0.5rem;
        }

        .pannello-filtri {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-bottom: 1rem;
            margin-top: -0.5rem;
            box-shadow: var(--shadow-soft);
        }
        .pannello-filtri.aperto { display: block; }

        .filtro-gruppo-titolo {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        /* Pillole lingua — selezione MULTIPLA: ogni pillola si accende/
           spegne in modo indipendente dalle altre. */
        .filtro-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.7rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            margin-right: 0.35rem;
            margin-bottom: 0.35rem;
        }
        .filtro-pill.attivo {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Slider doppio prezzo — costruito su misura con due <input
           type="range"> sovrapposti (nessuna libreria esterna, coerente
           col resto del progetto). Solo le manopole sono cliccabili
           (pointer-events sul thumb, non sulla barra), così i due cursori
           non si "rubano" il click a vicenda. */
        .price-slider-wrap { position: relative; height: 32px; margin: 0.3rem 0 0.2rem; }
        .price-slider-track {
            position: absolute; top: 50%; left: 0; right: 0; height: 4px;
            background-color: var(--border-color); border-radius: 2px;
            transform: translateY(-50%);
        }
        .price-slider-range {
            position: absolute; top: 50%; height: 4px;
            background-color: var(--primary); border-radius: 2px;
            transform: translateY(-50%);
        }
        .price-slider-wrap input[type="range"] {
            position: absolute; top: 50%; left: 0; width: 100%;
            transform: translateY(-50%);
            -webkit-appearance: none; appearance: none;
            background: transparent; pointer-events: none; margin: 0;
        }
        .price-slider-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; pointer-events: auto;
            width: 18px; height: 18px; border-radius: 50%;
            background-color: var(--primary); cursor: pointer;
            border: 2px solid var(--card-bg); box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .price-slider-wrap input[type="range"]::-moz-range-thumb {
            pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
            background-color: var(--primary); cursor: pointer;
            border: 2px solid var(--card-bg); box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        .price-slider-labels {
            display: flex; justify-content: space-between;
            font-size: 0.75rem; color: var(--text-muted); font-weight: 700;
        }

        .btn-reset-filtri {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            padding: 0.4rem 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-reset-filtri:hover { color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="favicon.ico" alt="Favicon">
            <span>CardSync Pro — Sealed</span>
        </div>
        <p>Seleziona i prodotti sealed che ti interessano — il totale si aggiorna da solo.</p>
    </header>

    <!-- MODALE IMMAGINE INGRANDITA -->
    <div id="immagineModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center;" onclick="chiudiImmagineIngrandita()">
        <div style="max-width:320px; width:90%; background:var(--card-bg); border-radius:16px; padding:1rem; position:relative;" onclick="event.stopPropagation()">
            <button onclick="chiudiImmagineIngrandita()" style="position:absolute; top:0.6rem; right:0.6rem; background:none; border:none; font-size:1.2rem; color:var(--text-muted); cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            <img id="immagineIngranditaImg" src="" alt="" style="width:100%; border-radius:12px; margin-top:0.5rem;">
        </div>
    </div>

    <div class="container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
            <input type="text" id="searchInput" placeholder="Cerca carta o codice..." oninput="renderLista()">
        </div>

        <button class="btn-filtri" id="btnFiltri" onclick="toggleFiltri()">
            <i class="fa-solid fa-filter"></i> Filtri
            <span id="filtriAttiviCount" style="display:none;"></span>
            <i class="fa-solid fa-chevron-down"></i>
        </button>

        <div class="pannello-filtri" id="pannelloFiltri">
            <div class="filtro-gruppo-titolo">Lingua</div>
            <div id="filtriLinguaPills"></div>

            <div class="filtro-gruppo-titolo" style="margin-top:0.9rem;">Prezzo</div>
            <div class="price-slider-wrap">
                <div class="price-slider-track"></div>
                <div class="price-slider-range" id="priceSliderRange"></div>
                <input type="range" id="sliderPrezzoMin" oninput="onSliderPrezzoInput('min')">
                <input type="range" id="sliderPrezzoMax" oninput="onSliderPrezzoInput('max')">
            </div>
            <div class="price-slider-labels">
                <span id="labelPrezzoMin"></span>
                <span id="labelPrezzoMax"></span>
            </div>

            <button class="btn-reset-filtri" onclick="resetFiltri()">
                <i class="fa-solid fa-rotate-left"></i> Reset filtri
            </button>
        </div>

        <div id="listaContainer">
            <div class="stato-caricamento"><i class="fa-solid fa-spinner fa-spin"></i> Caricamento carte disponibili...</div>
        </div>
    </div>

    <div class="barra-totale">
        <div class="barra-totale-info">
            <div class="barra-totale-count" id="conteggioSelezionate">0 carte selezionate</div>
            <div class="barra-totale-value" id="totaleSelezionate">0,00 €</div>
        </div>
        <button class="btn-copia" id="btnCopiaRiepilogo" onclick="copiaRiepilogo()" disabled>
            <i class="fa-solid fa-copy"></i> Copia riepilogo
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://iwdkgehbktvkujhwqdwq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3ZGtnZWhia3R2a3VqaHdxZHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMzM1MzYsImV4cCI6MjEwMTcwOTUzNn0.Pdcmuj5eXuh_z43CInsdGRkNwloHpqlhBGnBI9kvKe0';
        // Client "leggero": niente persistSession/autoRefreshToken — questa
        // pagina è pubblica, chi la apre non fa mai login, serve solo il
        // client per interrogare Supabase come utente anonimo (ruolo 'anon',
        // limitato dalla RLS a leggere solo le carte in scambio — vedi
        // scambio_pubblico_rls.sql).
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
        });

        let carte = [];
        const selezioni = {}; // { [id]: quantitaSelezionata }

        // A16: stato dei filtri — Lingua è selezione MULTIPLA (Set vuoto =
        // nessun filtro attivo, mostra tutte le lingue). Prezzo è un range
        // [min, max] calcolato DINAMICAMENTE dai prodotti realmente
        // disponibili al caricamento, non un range fisso.
        const filtriStato = {
            lingue: new Set(),
            prezzoMin: 0,
            prezzoMax: 0,
        };
        let prezzoDatiMin = 0;
        let prezzoDatiMax = 0;

        // Il campo 'immagine' può contenere tre formati diversi, a seconda
        // di quando la carta è stata processata:
        // 1. Link a Supabase Storage (nuovo, leggero — riconoscibile da
        //    "supabase.co") → si usa direttamente.
        // 2. Data URI base64 (vecchio formato, prima che passassimo a
        //    Storage) → si usa direttamente, funziona comunque.
        // 3. URL esterno grezzo di Cardmarket (carte processate PRIMA di
        //    qualunque correzione) → Cardmarket lo blocca se richiesto da
        //    un altro dominio, tentiamo il proxy come ripiego (funziona
        //    solo per alcune, meglio di niente per lo storico).
        function _urlImmagineVisualizzabile(immagine) {
            if (!immagine) return null;
            if (immagine.startsWith('data:') || immagine.includes('supabase.co')) return immagine;
            return `https://images.weserv.nl/?url=${encodeURIComponent(immagine)}&w=64`;
        }

        function apriImmagineIngrandita(src) {
            document.getElementById('immagineIngranditaImg').src = src;
            document.getElementById('immagineModal').style.display = 'flex';
        }

        function chiudiImmagineIngrandita() {
            document.getElementById('immagineModal').style.display = 'none';
        }

        function formattaEuro(v) {
            return v.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        async function caricaCatalogo() {
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('u');
            const container = document.getElementById('listaContainer');

            if (!userId) {
                container.innerHTML = '<div class="stato-errore"><i class="fa-solid fa-triangle-exclamation"></i> Link non valido — manca il riferimento alla collezione.</div>';
                return;
            }

            // RISOLTO 18/08/2026 (Problema #2, STATO_PROGETTO.txt sez.7):
            // non si legge più direttamente la tabella 'carte' filtrata solo
            // lato client — si passa dalla RPC dedicata leggi_sealed_condiviso
            // (SECURITY DEFINER, stesso pattern già in uso da mesi in
            // scambio.html/wishlist.html con leggi_scambio_condiviso /
            // leggi_wishlist_condivisa), che applica il filtro tipo='sealed'
            // AND stato='collezione' AND location='SCAMBIO' direttamente nel
            // database, non più solo nel browser di chi guarda la pagina.
            const { data, error } = await supabaseClient
                .rpc('leggi_sealed_condiviso', { p_owner_id: userId });

            if (error) {
                container.innerHTML = `<div class="stato-errore"><i class="fa-solid fa-triangle-exclamation"></i> Errore nel caricamento: ${error.message}</div>`;
                return;
            }

            carte = (data || [])
                .map(r => ({
                    id: r.id,
                    name: r.nome || '',
                    code: r.codice || '',
                    lang: r.lingua || 'IT',
                    cond: r.condizione || 'NM',
                    qtyDisponibile: r.qty || 1,
                    price: r.prezzo != null ? Number(r.prezzo) : 0,
                    notes: r.note || '',
                    immagine: r.immagine || null,
                }))
                // A16: quantità a 0 nascoste ALLA FONTE — non devono
                // comparire mai, nemmeno cercandole per nome nella barra
                // di ricerca (decisione esplicita di Claudio).
                .filter(c => c.qtyDisponibile > 0);

            if (carte.length === 0) {
                container.innerHTML = '<div class="stato-vuoto"><i class="fa-solid fa-box-open"></i><br>Nessun prodotto sealed condiviso per lo scambio al momento.</div>';
                return;
            }

            inizializzaFiltri();
            renderLista();
        }

        // A16: costruisce le pillole Lingua in base a quelle REALMENTE
        // presenti nei dati caricati (non un elenco fisso — se un giorno
        // arriva una lingua nuova, compare da sola), e calcola il range di
        // prezzo dinamico dai prodotti disponibili in quel momento.
        function inizializzaFiltri() {
            const lingue = [...new Set(carte.map(c => c.lang))].sort();
            document.getElementById('filtriLinguaPills').innerHTML = lingue.map(l =>
                `<button type="button" class="filtro-pill" id="pillLingua-${l}" onclick="toggleFiltroLingua('${l}')">${l}</button>`
            ).join('');

            const prezzi = carte.map(c => c.price);
            prezzoDatiMin = Math.floor(Math.min(...prezzi));
            prezzoDatiMax = Math.ceil(Math.max(...prezzi));
            if (prezzoDatiMin === prezzoDatiMax) prezzoDatiMax += 1; // evita uno slider "piatto" con un solo prodotto

            const sliderMin = document.getElementById('sliderPrezzoMin');
            const sliderMax = document.getElementById('sliderPrezzoMax');
            [sliderMin, sliderMax].forEach(s => { s.min = prezzoDatiMin; s.max = prezzoDatiMax; });
            sliderMin.value = prezzoDatiMin;
            sliderMax.value = prezzoDatiMax;
            filtriStato.prezzoMin = prezzoDatiMin;
            filtriStato.prezzoMax = prezzoDatiMax;

            aggiornaVisualeSliderPrezzo();
        }

        function toggleFiltroLingua(lingua) {
            if (filtriStato.lingue.has(lingua)) {
                filtriStato.lingue.delete(lingua);
            } else {
                filtriStato.lingue.add(lingua);
            }
            document.getElementById('pillLingua-' + lingua).classList.toggle('attivo');
            aggiornaContatoreFiltriAttivi();
            renderLista();
        }

        function onSliderPrezzoInput(quale) {
            const sliderMin = document.getElementById('sliderPrezzoMin');
            const sliderMax = document.getElementById('sliderPrezzoMax');
            let min = parseInt(sliderMin.value, 10);
            let max = parseInt(sliderMax.value, 10);

            // Impedisce ai due cursori di "scavalcarsi" — il minimo non può
            // superare il massimo e viceversa.
            if (quale === 'min' && min > max) { min = max; sliderMin.value = min; }
            if (quale === 'max' && max < min) { max = min; sliderMax.value = max; }

            filtriStato.prezzoMin = min;
            filtriStato.prezzoMax = max;
            aggiornaVisualeSliderPrezzo();
            aggiornaContatoreFiltriAttivi();
            renderLista();
        }

        function aggiornaVisualeSliderPrezzo() {
            const range = prezzoDatiMax - prezzoDatiMin || 1;
            const percMin = ((filtriStato.prezzoMin - prezzoDatiMin) / range) * 100;
            const percMax = ((filtriStato.prezzoMax - prezzoDatiMin) / range) * 100;
            const barraColorata = document.getElementById('priceSliderRange');
            barraColorata.style.left = percMin + '%';
            barraColorata.style.right = (100 - percMax) + '%';
            document.getElementById('labelPrezzoMin').textContent = formattaEuro(filtriStato.prezzoMin);
            document.getElementById('labelPrezzoMax').textContent = formattaEuro(filtriStato.prezzoMax);
        }

        function aggiornaContatoreFiltriAttivi() {
            const prezzoModificato = filtriStato.prezzoMin !== prezzoDatiMin || filtriStato.prezzoMax !== prezzoDatiMax;
            const numeroFiltriAttivi = filtriStato.lingue.size + (prezzoModificato ? 1 : 0);
            const badge = document.getElementById('filtriAttiviCount');
            if (numeroFiltriAttivi > 0) {
                badge.textContent = numeroFiltriAttivi;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        function resetFiltri() {
            filtriStato.lingue.clear();
            document.querySelectorAll('.filtro-pill.attivo').forEach(p => p.classList.remove('attivo'));

            filtriStato.prezzoMin = prezzoDatiMin;
            filtriStato.prezzoMax = prezzoDatiMax;
            document.getElementById('sliderPrezzoMin').value = prezzoDatiMin;
            document.getElementById('sliderPrezzoMax').value = prezzoDatiMax;
            aggiornaVisualeSliderPrezzo();

            aggiornaContatoreFiltriAttivi();
            renderLista();
        }

        function toggleFiltri() {
            document.getElementById('pannelloFiltri').classList.toggle('aperto');
            document.getElementById('btnFiltri').classList.toggle('aperto');
        }

        function renderLista() {
            const container = document.getElementById('listaContainer');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            // A16: ricerca testuale + filtro Lingua (multi-selezione) +
            // filtro Prezzo (range) — tutti combinati insieme (AND), come
            // richiesto da Claudio.
            const filtrate = carte.filter(c => {
                const corrispondeRicerca = c.name.toLowerCase().includes(searchVal) || c.code.toLowerCase().includes(searchVal);
                const corrispondeLingua = filtriStato.lingue.size === 0 || filtriStato.lingue.has(c.lang);
                const corrispondePrezzo = c.price >= filtriStato.prezzoMin && c.price <= filtriStato.prezzoMax;
                return corrispondeRicerca && corrispondeLingua && corrispondePrezzo;
            });

            if (filtrate.length === 0) {
                container.innerHTML = '<div class="stato-vuoto"><i class="fa-solid fa-magnifying-glass"></i><br>Nessun prodotto corrisponde alla ricerca/ai filtri.</div>';
                return;
            }

            container.innerHTML = filtrate.map(c => {
                const selezionata = selezioni[c.id] > 0;
                const qtyAttuale = selezioni[c.id] || 0;
                return `
                    <div class="card-row ${selezionata ? 'selected' : ''}" id="row-${c.id}">
                        <input type="checkbox" class="card-checkbox" ${selezionata ? 'checked' : ''}
                               onchange="toggleSelezione('${c.id}', this.checked)">
                        ${(() => { const immagineSrc = _urlImmagineVisualizzabile(c.immagine); return immagineSrc ? `<img src="${immagineSrc}" alt="" class="card-thumb" onclick="event.stopPropagation(); apriImmagineIngrandita('${immagineSrc}')" onerror="this.style.display='none';">` : ''; })()}
                        <div class="card-info">
                            <div class="card-name">${escapeHtml(c.name)}${c.code ? ` <span style="color:var(--text-muted); font-weight:600;">(${c.code})</span>` : ''}</div>
                            <div class="card-meta">
                                <span class="badge">${c.lang}</span>
                                <span class="badge">${c.cond}</span>
                                <span class="badge">Disp. ${c.qtyDisponibile}</span>
                                <!-- A16 (18/08/2026): badge location rimosso — con il filtro
                                     location='SCAMBIO' applicato in caricaCatalogo(), ogni riga
                                     mostrata ha sempre lo stesso valore, quindi il badge sarebbe
                                     ridondante su ogni singola carta. -->
                                ${c.notes ? `<span class="badge">✨ ${escapeHtml(c.notes)}</span>` : ''}
                            </div>
                        </div>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="modificaQty('${c.id}', -1)" ${qtyAttuale <= 0 ? 'disabled' : ''}>-</button>
                            <span class="qty-value">${qtyAttuale}</span>
                            <button class="qty-btn" onclick="modificaQty('${c.id}', 1)" ${qtyAttuale >= c.qtyDisponibile ? 'disabled' : ''}>+</button>
                        </div>
                        <div class="card-price">${formattaEuro(c.price)}<small>cad.</small></div>
                    </div>
                `;
            }).join('');
        }

        function toggleSelezione(id, checked) {
            selezioni[id] = checked ? 1 : 0;
            renderLista();
            aggiornaTotale();
        }

        function modificaQty(id, delta) {
            const carta = carte.find(c => c.id === id);
            if (!carta) return;
            const attuale = selezioni[id] || 0;
            const nuova = Math.max(0, Math.min(carta.qtyDisponibile, attuale + delta));
            selezioni[id] = nuova;
            renderLista();
            aggiornaTotale();
        }

        function aggiornaTotale() {
            let totale = 0;
            let numCarte = 0;
            carte.forEach(c => {
                const q = selezioni[c.id] || 0;
                totale += q * c.price;
                numCarte += q;
            });
            document.getElementById('conteggioSelezionate').textContent =
                `${numCarte} cart${numCarte === 1 ? 'a selezionata' : 'e selezionate'}`;
            document.getElementById('totaleSelezionate').textContent = formattaEuro(totale);
            document.getElementById('btnCopiaRiepilogo').disabled = numCarte === 0;
        }

        function copiaRiepilogo() {
            const righe = [];
            let totale = 0;
            carte.forEach(c => {
                const q = selezioni[c.id] || 0;
                if (q > 0) {
                    righe.push(`${q}x ${c.name}${c.code ? ' (' + c.code + ')' : ''} — ${formattaEuro(c.price * q)}`);
                    totale += q * c.price;
                }
            });
            if (righe.length === 0) return;

            const testo = `Prodotti sealed che mi interessano:\n\n${righe.join('\n')}\n\nTotale: ${formattaEuro(totale)}`;

            navigator.clipboard.writeText(testo).then(() => {
                const btn = document.getElementById('btnCopiaRiepilogo');
                const originale = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Copiato!';
                setTimeout(() => { btn.innerHTML = originale; }, 1800);
            }).catch(() => {
                alert(testo); // fallback se il clipboard non è disponibile (es. http non sicuro)
            });
        }

        // Applica lo stesso tema scelto dal proprietario sul proprio
        // dispositivo — passato nell'URL (non c'è login qui, quindi niente
        // localStorage da leggere), fatto subito prima di ogni altra cosa
        // per evitare un lampo del tema sbagliato.
        (function applicaTemaCondiviso() {
            const params = new URLSearchParams(window.location.search);
            const tema = params.get('tema');
            if (tema === 'verde' || tema === 'pokemon') document.body.classList.add('theme-' + tema);
            if (params.get('scuro') === '1') document.body.classList.add('dark-mode');
        })();

        caricaCatalogo();
    </script>
</body>
</html>
